<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#141C2F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Giochi">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icone/icon-192.png?v=3">
<link rel="apple-touch-icon" href="icone/apple-touch-icon.png?v=3">
<style>@view-transition{navigation:auto}</style>
<link rel="stylesheet" href="comune/app.css">
<title>Giochi di Simo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --night:#141C2F; --night-2:#1B2540; --line:rgba(232,226,212,.12);
  --face:#EFE7D6; --face-edge:#D9CDB4; --ink:#1A1F2B; --muted:#97A3BA;
  --red:#B8322A; --gold:#D8A84A; --text:#ECE7DC;
  --display:'Bricolage Grotesque','Arial Narrow',system-ui,sans-serif;
  --ui:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--night);color:var(--text);font-family:var(--ui);-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden}   /* le carte inclinate sporgono di un pixel: niente scorrimento laterale */
body{min-height:100dvh}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.wrap{max-width:560px;margin:0 auto;padding:max(22px,env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom))}

h1{font-family:var(--display);font-weight:800;font-size:clamp(44px,14vw,64px);line-height:.92;letter-spacing:-.02em;margin:18px 0 10px}
.sub{margin:0 0 30px;color:var(--muted);font-size:16px;line-height:1.45;max-width:32ch}

/* Le due categorie sono due carte da gioco: l'unico elemento "forte" della pagina */
.deck{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pcard{position:relative;display:flex;flex-direction:column;justify-content:flex-end;aspect-ratio:5/7;padding:16px 14px;border-radius:16px;text-decoration:none;
  background:var(--face);color:var(--ink);border:1px solid var(--face-edge);
  box-shadow:0 1px 0 rgba(255,255,255,.6) inset,0 18px 34px rgba(0,0,0,.42);transition:transform .18s ease}
.pcard:nth-child(odd){transform:rotate(-2.5deg)}
.pcard:nth-child(even){transform:rotate(2deg);margin-top:18px}
.pcard:nth-child(3){transform:rotate(1.5deg)}
.pcard:nth-child(4){transform:rotate(-1.8deg)}
.pcard:active{transform:scale(.97)}
@media (prefers-reduced-motion:reduce){.pcard{transition:none}}
.idx{position:absolute;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--display);font-weight:800;font-size:22px;line-height:1;color:var(--red)}
.idx svg{width:15px;height:15px}
.idx.tl{top:12px;left:12px}
.idx.br{bottom:12px;right:12px;transform:rotate(180deg)}
.pcard .art{position:absolute;inset:16% 18% 34%;display:grid;place-items:center}
.pcard .art svg{width:100%;height:100%}
.pcard .nm{font-family:var(--display);font-weight:800;font-size:32px;line-height:1;margin:0 0 4px}
.pcard .nm.long{font-size:clamp(18px,5.4vw,24px);margin-right:16px}
.pcard .ct{font-size:14px;color:#5D5A50;font-weight:600;margin-right:22px}

.hint{margin:34px 0 0;color:var(--muted);font-size:13.5px;line-height:1.5}

/* Condividi: piccolo, in basso a destra; è sempre l'ultima cosa della home e scorre con le carte.
   Pulisci tutto: uguale, in basso a sinistra; va tenuto premuto finché lo sfondo si riempie */
.sharerow{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:44px}
.wipe{position:relative;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
.wipe .fill{position:absolute;inset:3px -7px;border-radius:7px;background:rgba(216,168,74,.3);transform:scaleX(0);transform-origin:left;transition:transform .16s ease-out}
.wipe.carica .fill{transform:scaleX(1);transition:transform var(--ms,1200ms) linear}
.wipe.carica{color:var(--text)}
.wipe svg,.wipe .lbl{position:relative}
@media (prefers-reduced-motion:reduce){.wipe.carica .fill{transition:none}}
.share{display:flex;align-items:center;gap:5px;padding:8px 0;border:0;background:none;
  color:var(--muted);font-family:var(--ui);font-size:13.5px;font-weight:600;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.share svg{width:15px;height:15px;flex:none}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:30;max-width:90vw;
  padding:11px 16px;border-radius:12px;background:var(--text);color:var(--ink);font-weight:700;font-size:14.5px;text-align:center;
  overflow-wrap:anywhere;box-shadow:0 8px 24px rgba(0,0,0,.45)}

/* Elenco giochi di una categoria */
.backbtn{display:inline-block;padding:8px 0;color:var(--gold);font-weight:700;font-size:15px;text-decoration:none;background:none;border:0;cursor:pointer;font-family:var(--ui)}
.cathead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:10px 0 22px}
.cathead h1{margin:0}
.cathead p{margin:6px 0 0;color:var(--muted);font-size:15px}
ul.games{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.game{display:grid;grid-template-columns:8px 1fr auto;align-items:center;gap:0 14px;min-height:84px;padding:14px 16px 14px 0;border-radius:14px;
  background:var(--night-2);border:1px solid var(--line);text-decoration:none;overflow:hidden}
.game:active{background:#222E4E}
.game .spine{align-self:stretch;background:var(--c,var(--gold));border-radius:0 6px 6px 0;box-shadow:1px 0 0 var(--f,transparent)}
.game .gn{display:block;font-family:var(--display);font-weight:800;font-size:25px;line-height:1.05}
.game .gd{display:block;margin-top:4px;color:var(--muted);font-size:14.5px;line-height:1.35}
.game .go{font-size:28px;color:var(--muted);line-height:1}
.empty{color:var(--muted)}
</style>
</head>
<body>
<main class="wrap">
  <section id="home">
    <h1>Giochi di Simo</h1>
    <p class="sub">Niente foglietti, niente fiches: scegli a cosa si gioca stasera.</p>
    <nav class="deck" id="deck" aria-label="Categorie"></nav>
    <p class="hint" id="installHint" hidden>Per averla come app: in Safari tocca Condividi e poi «Aggiungi alla schermata Home».</p>
    <div class="sharerow">
      <button class="share wipe" id="wipeBtn" aria-label="Cancella nomi, squadre, impostazioni e partite di tutti i giochi (tieni premuto)"><span class="fill"></span><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 10a6.5 6.5 0 1 0 2-4.7"/><path d="M3.2 2.8v3.4h3.4"/></svg><span class="lbl">Pulisci tutto</span></button>
      <button class="share" id="shareBtn" aria-label="Condividi il link dell’app"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 12.5V2.5M6.5 6 10 2.5 13.5 6"/><path d="M6.5 9H5a1.5 1.5 0 0 0-1.5 1.5v6A1.5 1.5 0 0 0 5 18h10a1.5 1.5 0 0 0 1.5-1.5v-6A1.5 1.5 0 0 0 15 9h-1.5"/></svg>Condividi</button>
    </div>
  </section>
  <div class="toast" id="toast" role="status" hidden></div>
  <section id="cat" hidden>
    <button class="backbtn" id="backBtn">‹ Tutti i giochi</button>
    <div class="cathead"><div><h1 id="catName"></h1><p id="catDesc"></p></div></div>
    <ul class="games" id="games"></ul>
  </section>
</main>
<script src="giochi.js"></script>
<script src="comune/pulizia.js"></script>
<script>
'use strict';
const G = self.GIOCHI || { categorie: [], giochi: [] };
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const SUIT = '<svg viewBox="0 0 20 20" aria-hidden="true"><path fill="currentColor" d="M10 1.5 16.5 10 10 18.5 3.5 10Z"/></svg>';
const ART = {
  carte: `<svg viewBox="0 0 120 120" aria-hidden="true">
    <g stroke="#1A1F2B" stroke-width="2.5">
      <rect x="22" y="22" width="48" height="68" rx="7" fill="#FBF7EE" transform="rotate(-16 46 56)"/>
      <rect x="36" y="18" width="48" height="68" rx="7" fill="#FBF7EE"/>
      <rect x="50" y="22" width="48" height="68" rx="7" fill="#B8322A" transform="rotate(16 74 56)"/>
    </g>
    <g transform="rotate(16 74 56)" fill="none" stroke="#F3D9A0" stroke-width="2"><rect x="56" y="28" width="36" height="56" rx="4"/></g>
    <path transform="translate(74 57) rotate(16) scale(1.15)" d="M0 8 C-12 0 -11 -9 -5.5 -9 C-2.5 -9 -0.5 -7 0 -5 C0.5 -7 2.5 -9 5.5 -9 C11 -9 12 0 0 8 Z" fill="#E0473C" stroke="#F3D9A0" stroke-width="1.6" stroke-linejoin="round"/>
  </svg>`,
  dado: `<svg viewBox="0 0 120 120" aria-hidden="true">
    <g transform="rotate(-6 60 60)">
      <path d="M62 14 L88 29 L88 59 L62 74 L36 59 L36 29 Z" fill="#3F7A57" stroke="#1A1F2B" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M62 22 L81 33 L81 55 L62 66 L43 55 L43 33 Z" fill="none" stroke="#9CC9A8" stroke-width="1.6" stroke-dasharray="3 3"/>
      <circle cx="62" cy="44" r="9" fill="#FBF7EE" stroke="#1A1F2B" stroke-width="2"/>
      <text x="62" y="48.5" text-anchor="middle" font-family="Bricolage Grotesque,Arial Narrow,sans-serif" font-weight="800" font-size="12" fill="#1A1F2B">6</text>
      <g transform="translate(10 46) scale(1.42)">
        <path d="M20 2 C25 2 28 6 28 10 C28 13 26.5 15 25 16 L36 20 C39 21 40 24 38 27 C37 29 34 29 32 28 L27 26 L30 38 L22 38 L20 32 L18 38 L10 38 L13 26 L8 28 C6 29 3 29 2 27 C0 24 1 21 4 20 L15 16 C13.5 15 12 13 12 10 C12 6 15 2 20 2 Z" fill="#D8A84A" stroke="#1A1F2B" stroke-width="1.9" stroke-linejoin="round"/>
      </g>
      <circle cx="91" cy="86" r="20" fill="#7A1F1A" stroke="#1A1F2B" stroke-width="2.5"/>
      <circle cx="86" cy="80" r="20" fill="#B8322A" stroke="#1A1F2B" stroke-width="2.5"/>
      <circle cx="86" cy="80" r="16" fill="none" stroke="#FBF7EE" stroke-width="5" stroke-dasharray="6.5 6.07"/>
      <circle cx="86" cy="80" r="10" fill="#FBF7EE" stroke="#1A1F2B" stroke-width="1.5"/>
      <circle cx="86" cy="80" r="7" fill="none" stroke="#B8322A" stroke-width="1.2" stroke-dasharray="2 2"/>
    </g>
  </svg>`
};
ART.punti = `<svg viewBox="0 0 120 120" aria-hidden="true">
    <g transform="rotate(-8 60 60)">
      <rect x="16" y="30" width="88" height="60" rx="9" fill="#1A1F2B"/>
      <rect x="21" y="35" width="38" height="50" rx="5" fill="#B8322A"/>
      <rect x="61" y="35" width="38" height="50" rx="5" fill="#2F5FA8"/>
      <text x="40" y="70" text-anchor="middle" font-family="Bricolage Grotesque,Arial Narrow,sans-serif" font-weight="800" font-size="28" fill="#FBF7EE">7</text>
      <text x="80" y="70" text-anchor="middle" font-family="Bricolage Grotesque,Arial Narrow,sans-serif" font-weight="800" font-size="28" fill="#FBF7EE">5</text>
    </g>
  </svg>`;
ART.maschera = `<svg viewBox="0 0 120 120" aria-hidden="true">
    <g transform="rotate(-6 60 60)">
      <path d="M60 102 L40 88 L25 66 L29 46 L33 14 L50 37 Q60 33 70 37 L87 14 L91 46 L95 66 L80 88 Z" fill="#1A1F2B" stroke="#1A1F2B" stroke-width="3" stroke-linejoin="round"/>
      <path d="M37 24 L45 38 L39 40 Z M83 24 L75 38 L81 40 Z" fill="#5A4E46"/>
      <path d="M26 50 Q43 41 60 50 Q77 41 94 50 L92 61 Q76 68 60 59 Q44 68 28 61 Z" fill="#B8322A"/>
      <ellipse cx="44" cy="54.5" rx="6.5" ry="3.6" fill="#FBF7EE"/>
      <ellipse cx="76" cy="54.5" rx="6.5" ry="3.6" fill="#FBF7EE"/>
      <path d="M94 52 C103 49 108 42 107 33" stroke="#B8322A" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <path d="M54 86 L60 91 L66 86 Z" fill="#FBF7EE"/>
    </g>
  </svg>`;
ART.fascicolo = `<svg viewBox="0 0 120 120" aria-hidden="true">
    <g transform="rotate(-7 60 60)">
      <path d="M18 28 H46 L53 36 H98 A4 4 0 0 1 102 40 V94 A4 4 0 0 1 98 98 H22 A4 4 0 0 1 18 94 Z" fill="#3B4046" stroke="#1A1F2B" stroke-width="2.5" stroke-linejoin="round"/>
      <g transform="rotate(5 60 46)">
        <rect x="28" y="22" width="62" height="44" rx="2" fill="#FBF7EE" stroke="#1A1F2B" stroke-width="2"/>
        <g stroke="#A39C8C" stroke-width="2.2" stroke-linecap="round"><path d="M35 32 H78"/><path d="M35 39 H83"/><path d="M35 46 H70"/></g>
      </g>
      <path d="M14 50 H104 A4 4 0 0 1 108 54.5 L103 94.5 A4 4 0 0 1 99 98 H21 A4 4 0 0 1 17 94.5 L10 54.5 A4 4 0 0 1 14 50 Z" fill="#4E8C86" stroke="#1A1F2B" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M22 58 H98" stroke="#7DB3AC" stroke-width="1.6" stroke-dasharray="4 3"/>
      <g transform="rotate(-9 60 78)">
        <rect x="25" y="68" width="70" height="19" rx="2.5" fill="none" stroke="#B8322A" stroke-width="2.6"/>
        <text x="60" y="81.6" text-anchor="middle" textLength="60" lengthAdjust="spacingAndGlyphs" font-family="Bricolage Grotesque,Arial Narrow,sans-serif" font-weight="800" font-size="11" fill="#B8322A">RISERVATO</text>
      </g>
    </g>
  </svg>`;
const LETTER = { carte: 'C', dado: 'A', punti: 'P', maschera: 'G', fascicolo: 'E' };

function renderHome() {
  $('deck').innerHTML = G.categorie.map(c => {
    const list = G.giochi.filter(g => g.categoria === c.id), n = list.length;
    const L = LETTER[c.simbolo] || c.nome[0];
    const href = c.diretto && list[0] ? list[0].link : '#' + c.id;
    const un = c.unita || ['gioco', 'giochi'];   // es. ['app/gioco', 'app/giochi'] per Altro
    const ct = c.etichetta || `${n} ${n === 1 ? un[0] : un[1]}`;
    return `<a class="pcard" href="${esc(href)}">
      <span class="idx tl">${esc(L)}${SUIT}</span><span class="idx br">${esc(L)}${SUIT}</span>
      <span class="art">${ART[c.simbolo] || ART.dado}</span>
      <span class="nm${c.nome.length > 7 ? ' long' : ''}">${esc(c.nome)}</span><span class="ct">${esc(ct)}</span></a>`;
  }).join('');
}
function renderCat(id) {
  const c = G.categorie.find(x => x.id === id);
  if (!c) return false;
  const list = G.giochi.filter(g => g.categoria === id);
  $('catName').textContent = c.nome; $('catDesc').textContent = c.descrizione || '';
  $('games').innerHTML = list.length ? list.map(g => `<li><a class="game" href="${esc(g.link)}" style="--c:${esc(g.colore || '')}${g.filo ? ';--f:' + esc(g.filo) : ''}">
      <span class="spine"></span><span><span class="gn">${esc(g.nome)}</span><span class="gd">${esc(g.descrizione || '')}</span></span><span class="go" aria-hidden="true">›</span></a></li>`).join('')
    : '<li class="empty">Ancora nessun gioco qui.</li>';
  document.title = `${c.nome}, Giochi di Simo`;
  return true;
}
function route() {
  const id = decodeURIComponent(location.hash.slice(1));
  const inCat = id && renderCat(id);
  $('home').hidden = !!inCat; $('cat').hidden = !inCat;
  if (!inCat) document.title = 'Giochi di Simo';
  window.scrollTo(0, 0);
}
$('backBtn').onclick = () => { location.hash = ''; };
window.addEventListener('hashchange', e => {
  // passaggio morbido tra le carte e l'elenco, con l'animazione del cambio pagina (comune/app.css)
  if (e.hasUAVisualTransition) { route(); return; }   // il telefono anima già da sé (gesto indietro)
  if (document.startViewTransition) { document.startViewTransition(route); return; }
  route();                                            // browser senza view transition
  if (window.gdsAppare) gdsAppare($('home').hidden ? $('cat') : $('home'));
});
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
$('installHint').hidden = !!standalone || !/iPhone|iPad|iPod/.test(navigator.userAgent);
/* Condividi: il foglio di condivisione del telefono; dove non c'è, copia il link */
const LINK = new URL('./', location.href).href;   // indirizzo della home, senza #categoria
let toastT = null;
function toast(m) { const t = $('toast'); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2600); }
$('shareBtn').onclick = async () => {
  if (navigator.share) {
    try { await navigator.share({ title: 'Giochi di Simo', url: LINK }); return; }
    catch (e) { if (e && e.name === 'AbortError') return; }   // chiuso senza condividere
  }
  try { await navigator.clipboard.writeText(LINK); toast('Link copiato'); }
  catch (e) { toast(LINK); }
};
/* Pulisci tutto: tenuto premuto, cancella i dati di tutti i giochi (nomi, squadre, impostazioni,
   partite: comune/pulizia.js). Restano gli storici. Da solo succede ai giochi non aperti da 7 giorni. */
(function () {
  const b = $('wipeBtn'), MS = 1200;
  if (!window.gdsPulizia) { b.hidden = true; return; }
  let t = null, inizio = 0;
  const via = () => { clearTimeout(t); t = null; b.classList.remove('carica'); };
  const parti = () => {
    via(); inizio = Date.now();
    b.style.setProperty('--ms', MS + 'ms'); void b.offsetWidth; b.classList.add('carica');
    t = setTimeout(() => {
      via(); gdsPulizia.tutto();
      if (navigator.vibrate) navigator.vibrate(40);
      toast('Fatto: tutti i giochi sono come nuovi. Gli storici restano');
    }, MS);
  };
  const lascia = () => { if (!t) return; const presto = Date.now() - inizio < MS; via(); if (presto) toast('Tieni premuto per pulire nomi, squadre e partite di tutti i giochi'); };
  b.addEventListener('pointerdown', e => { e.preventDefault(); if (e.button > 0) return; parti(); });
  b.addEventListener('pointerup', lascia);
  b.addEventListener('pointercancel', via);
  b.addEventListener('pointerleave', lascia);
  b.addEventListener('contextmenu', e => e.preventDefault());
  b.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && !e.repeat) { e.preventDefault(); parti(); } });
  b.addEventListener('keyup', e => { if (e.key === 'Enter' || e.key === ' ') lascia(); });
})();
renderHome(); route();
</script>
<script src="comune/app.js"></script>
</body>
</html>
