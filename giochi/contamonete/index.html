<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#141C2F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Giochi">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="icon" type="image/png" href="../../icone/icon-192.png?v=2">
<link rel="apple-touch-icon" href="../../icone/apple-touch-icon.png?v=2">
<title>Conta Monete</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --night:#141C2F; --night-2:#1B2540; --night-3:#0E1424; --line:rgba(232,226,212,.12);
  --text:#ECE7DC; --muted:#97A3BA; --gold:#D8A84A; --red:#E06450;
  --display:'Bricolage Grotesque','Arial Narrow',system-ui,sans-serif;
  --ui:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:var(--night);color:var(--text);font-family:var(--ui);-webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden}
/* Sempre in orizzontale: con il telefono in verticale (o la rotazione bloccata) tutto
   viene girato di 90°, così si legge tenendo il telefono di lato. */
@media (orientation:portrait){
  .app{inset:auto;top:0;left:0;width:100vh;width:100dvh;height:100vw;transform-origin:0 0;transform:rotate(90deg) translateY(-100%)}
}
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:max(6px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) 6px max(14px,env(safe-area-inset-left))}
.back{justify-self:start;color:var(--gold);font-weight:700;font-size:15px;text-decoration:none;padding:8px 0}
.title{font-family:var(--display);font-weight:800;font-size:20px;margin:0;white-space:nowrap}
.right{justify-self:end;display:flex;align-items:center;gap:10px}
.reset{padding:8px 0;border:0;background:none;color:var(--muted);font-size:13.5px;font-weight:600;text-decoration:underline;text-underline-offset:3px;white-space:nowrap}
.reset.armed{color:#F0A493}

/* Tutta l'area centrale è il tasto: tocco = perdi una moneta, tieni premuto = la riprendi */
.area{position:relative;flex:1 1 auto;margin:0 max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));
  border-radius:22px;touch-action:none;cursor:pointer;overflow:hidden;container-type:size;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4cqh;
  background:radial-gradient(110% 80% at 50% 45%,#22305A 0%,#18213D 55%,#111829 100%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.05)}
.coins{display:flex;align-items:center;justify-content:center;gap:5cqw}
.slot{position:relative;width:min(26cqw,64cqh);aspect-ratio:1}
.slot::before{content:'';position:absolute;inset:4%;border-radius:50%;border:2px dashed rgba(236,231,220,.18)}
.coin{position:absolute;inset:0;transition:transform .45s cubic-bezier(.3,1.3,.5,1),opacity .35s ease;filter:drop-shadow(0 10px 12px rgba(0,0,0,.45))}
.coin svg{width:100%;height:100%;display:block}
.slot.lost .coin{opacity:0;transform:translateY(40%) rotate(35deg) scale(.6)}
.slot.back .coin{animation:pop .45s cubic-bezier(.3,1.4,.5,1)}
@keyframes pop{from{transform:scale(.4) rotate(-20deg);opacity:0}to{transform:none;opacity:1}}
.under{display:flex;align-items:baseline;justify-content:center;gap:16px;flex-wrap:wrap;padding:0 16px;text-align:center}
.state{font-family:var(--display);font-weight:800;font-size:clamp(18px,7cqh,30px)}
.state:empty{display:none}
.state.out{color:var(--red)}
.hint{color:var(--muted);font-weight:600;font-size:clamp(12.5px,4.6cqh,15px);line-height:1.4}
.ring{position:absolute;left:50%;top:50%;width:120px;height:120px;margin:-60px 0 0 -60px;pointer-events:none;opacity:0}
.ring circle{fill:none;stroke:var(--gold);stroke-width:6;stroke-linecap:round;stroke-dasharray:339.3;stroke-dashoffset:339.3;transform:rotate(-90deg);transform-origin:center}
.area.holding .ring{opacity:1}
.area.holding .ring circle{transition:stroke-dashoffset .6s linear;stroke-dashoffset:0}
.area.locked{cursor:default}

.lock{position:relative;overflow:hidden;display:flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--night-2);font-weight:800;font-size:14px;white-space:nowrap}
.lock svg{width:16px;height:16px;position:relative}
.lock .lbl{position:relative;display:flex;align-items:center;gap:6px}
.lock.on{background:var(--gold);border-color:var(--gold);color:#1A1F2B}
.lock .fill{position:absolute;inset:0;background:rgba(255,255,255,.55);transform:scaleX(0);transform-origin:left}
.lock.holding .fill{transition:transform .7s linear;transform:scaleX(1)}
.face{display:flex;align-items:center;gap:6px;height:36px;padding:0 10px 0 6px;border-radius:10px;border:1px solid var(--line);background:var(--night-2);font-weight:700;font-size:13px;color:var(--muted);white-space:nowrap}
.face .mini{display:block;width:24px;height:24px}
.face .mini svg,.facelist .pv svg{width:100%;height:100%;display:block}
.faces{position:absolute;inset:0;z-index:40;display:grid;place-items:center;padding:16px;background:rgba(6,9,18,.78)}
.facesheet{max-width:100%;padding:16px 18px;border-radius:18px;background:var(--night-2);border:1px solid var(--line)}
.facetitle{font-family:var(--display);font-weight:800;font-size:20px;margin:0 0 12px;text-align:center}
.facelist{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.facelist button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px;border-radius:14px;border:2px solid transparent;background:none;font-weight:700;font-size:13px;color:var(--muted)}
.facelist .pv{display:block;width:64px;height:64px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.4))}
.facelist button[aria-pressed="true"]{border-color:var(--gold);color:var(--text)}
.toast{position:absolute;left:50%;top:58px;transform:translateX(-50%);z-index:30;max-width:90%;padding:10px 16px;border-radius:12px;background:#ECE7DC;color:#1A1F2B;font-weight:700;font-size:14.5px;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.45);pointer-events:none}
@media (prefers-reduced-motion:reduce){.coin{transition:none}.slot.back .coin{animation:none}.area.holding .ring circle,.lock.holding .fill{transition:none}}
</style>
</head>
<body>
<!-- Le monete: disegni originali (oro per i centesimi, bimetalliche per gli euro) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <radialGradient id="oro" cx="36%" cy="30%" r="75%">
      <stop offset="0" stop-color="#FFF0A8"/>
      <stop offset=".38" stop-color="#E4BF52"/>
      <stop offset=".78" stop-color="#B38A26"/>
      <stop offset="1" stop-color="#7E5F16"/>
    </radialGradient>
    <linearGradient id="riflesso" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".45"/>
      <stop offset=".45" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="argento" cx="36%" cy="30%" r="75%">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".4" stop-color="#D8DCE2"/>
      <stop offset=".8" stop-color="#A3A9B2"/>
      <stop offset="1" stop-color="#6E747D"/>
    </radialGradient>
  </defs>
</svg>

<div class="app">
  <div class="top">
    <a class="back" href="../../">‹ Giochi</a>
    <h1 class="title">Conta Monete</h1>
    <div class="right">
      <button class="face" id="faceBtn" aria-label="Cambia moneta"></button>
      <button class="lock" id="lockBtn"><span class="fill"></span><span class="lbl" id="lockLbl"></span></button>
      <button class="reset" id="resetBtn">Reset</button>
    </div>
  </div>

  <div class="area" id="area" role="button" aria-label="Tocca per perdere una moneta, tieni premuto per riaverla">
    <div class="coins" id="coins"></div>
    <div class="under"><div class="state" id="state"></div><div class="hint" id="hint">Tocca per perdere una moneta · tieni premuto per riaverla</div></div>
    <svg class="ring" viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="54"/></svg>
  </div>

  <div class="toast" id="toast" hidden></div>
  <div class="faces" id="faces" hidden>
    <div class="facesheet" role="dialog" aria-modal="true" aria-label="Scegli la moneta">
      <div class="facetitle">Che moneta usiamo?</div>
      <div class="facelist" id="faceList"></div>
    </div>
  </div>
</div>

<script>
'use strict';
const $ = id => document.getElementById(id);
const KEY = 'gds-contamonete', TOT = 3;
let S = { perse: 0, bloccato: false };
try { Object.assign(S, JSON.parse(localStorage.getItem(KEY)) || {}); } catch (e) {}
S.perse = Math.max(0, Math.min(TOT, S.perse | 0));
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

/* Facce: si cambiano dal tasto in alto; di base 50 centesimi */
const FACES = {
  '10c': { n: '10', u: 'CENT', t: 'oro', lab: '10 cent' }, '20c': { n: '20', u: 'CENT', t: 'oro', lab: '20 cent' },
  '50c': { n: '50', u: 'CENT', t: 'oro', lab: '50 cent' }, '1e': { n: '1', u: 'EURO', t: 'bi1', lab: '1 euro' },
  '2e': { n: '2', u: 'EURO', t: 'bi2', lab: '2 euro' }
};
const ORDER = ['10c', '20c', '50c', '1e', '2e'];
if (!FACES[S.faccia]) S.faccia = '50c';
const METAL = { oro: { fill: 'url(#oro)', line: '#6E5212', mill: '#8A6A1C', ink: '#6B4F10', hi: '#FFF3BF' },
  argento: { fill: 'url(#argento)', line: '#5D636B', mill: '#6E747D', ink: '#3F444C', hi: '#FFFFFF' } };
function coinSVG(k) {
  const f = FACES[k], font = "'Bricolage Grotesque','Arial Narrow',sans-serif";
  if (f.t === 'oro') {
    const m = METAL.oro;
    return `<svg viewBox="0 0 100 100" aria-hidden="true">
      <circle cx="50" cy="50" r="48" fill="${m.fill}"/>
      <circle cx="50" cy="50" r="47" fill="none" stroke="${m.line}" stroke-width="2"/>
      <circle cx="50" cy="50" r="44.5" fill="none" stroke="${m.mill}" stroke-opacity=".75" stroke-width="3.2" stroke-dasharray=".9 1.5"/>
      <circle cx="50" cy="50" r="39.5" fill="none" stroke="#7A5C17" stroke-width="1.6"/>
      <circle cx="50" cy="50" r="38.2" fill="none" stroke="${m.hi}" stroke-opacity=".6" stroke-width="1"/>
      <g fill="#7A5C17" fill-opacity=".85"><circle cx="50" cy="16" r="1.6"/><circle cx="50" cy="84" r="1.6"/><circle cx="16" cy="50" r="1.6"/><circle cx="84" cy="50" r="1.6"/>
        <circle cx="26" cy="26" r="1.2"/><circle cx="74" cy="26" r="1.2"/><circle cx="26" cy="74" r="1.2"/><circle cx="74" cy="74" r="1.2"/></g>
      <text x="50" y="58.5" text-anchor="middle" font-family="${font}" font-weight="800" font-size="31" fill="${m.hi}" fill-opacity=".55">${f.n}</text>
      <text x="50" y="57.5" text-anchor="middle" font-family="${font}" font-weight="800" font-size="31" fill="${m.ink}">${f.n}</text>
      <text x="50" y="70" text-anchor="middle" font-family="'Figtree',system-ui,sans-serif" font-weight="800" font-size="7.5" letter-spacing="2" fill="${m.ink}">${f.u}</text>
      <circle cx="50" cy="50" r="48" fill="url(#riflesso)"/></svg>`;
  }
  /* Bimetalliche: 1 euro con anello argento e centro oro, 2 euro al contrario */
  const out = f.t === 'bi1' ? METAL.argento : METAL.oro, inn = f.t === 'bi1' ? METAL.oro : METAL.argento;
  return `<svg viewBox="0 0 100 100" aria-hidden="true">
    <circle cx="50" cy="50" r="48" fill="${out.fill}"/>
    <circle cx="50" cy="50" r="47" fill="none" stroke="${out.line}" stroke-width="2"/>
    <circle cx="50" cy="50" r="44.5" fill="none" stroke="${out.mill}" stroke-opacity=".75" stroke-width="3.2" stroke-dasharray=".9 1.5"/>
    <g fill="${out.ink}" fill-opacity=".7"><circle cx="50" cy="10.5" r="1.5"/><circle cx="36.5" cy="13" r="1.2"/><circle cx="63.5" cy="13" r="1.2"/><circle cx="24.5" cy="20" r="1"/><circle cx="75.5" cy="20" r="1"/></g>
    <text x="50" y="90.5" text-anchor="middle" font-family="'Figtree',system-ui,sans-serif" font-weight="800" font-size="7" letter-spacing="2.4" fill="${out.ink}">${f.u}</text>
    <circle cx="50" cy="50" r="31.5" fill="${inn.fill}" stroke="${out.line}" stroke-width="1.8"/>
    <circle cx="50" cy="50" r="29.3" fill="none" stroke="${inn.hi}" stroke-opacity=".55" stroke-width="1"/>
    <text x="50" y="62" text-anchor="middle" font-family="${font}" font-weight="800" font-size="34" fill="${inn.hi}" fill-opacity=".55">${f.n}</text>
    <text x="50" y="61" text-anchor="middle" font-family="${font}" font-weight="800" font-size="34" fill="${inn.ink}">${f.n}</text>
    <circle cx="50" cy="50" r="48" fill="url(#riflesso)"/></svg>`;
}
$('coins').innerHTML = Array.from({ length: TOT }, (_, i) => `<div class="slot" id="slot${i}"><div class="coin"></div></div>`).join('');
function renderFace() {
  document.querySelectorAll('#coins .coin').forEach(c => { c.innerHTML = coinSVG(S.faccia); });
  $('faceBtn').innerHTML = `<span class="mini">${coinSVG(S.faccia)}</span>${FACES[S.faccia].n}${FACES[S.faccia].u === 'CENT' ? '¢' : '€'}`;
  $('faceBtn').setAttribute('aria-label', `Moneta: ${FACES[S.faccia].lab}. Tocca per cambiarla`);
}
$('faceBtn').onclick = () => {
  $('faceList').innerHTML = ORDER.map(k => `<button data-face="${k}" aria-pressed="${k === S.faccia}"><span class="pv">${coinSVG(k)}</span>${FACES[k].lab}</button>`).join('');
  $('faces').hidden = false;
};
$('faceList').addEventListener('click', e => { const b = e.target.closest('[data-face]'); if (!b) return; S.faccia = b.dataset.face; save(); renderFace(); $('faces').hidden = true; });
$('faces').addEventListener('click', e => { if (e.target === $('faces')) $('faces').hidden = true; });
renderFace();
function render() {
  const left = TOT - S.perse;
  for (let i = 0; i < TOT; i++) $('slot' + i).classList.toggle('lost', i >= left);
  $('state').textContent = left === 0 ? 'Fuori!' : left === 1 ? 'Ultima moneta' : '';
  $('state').classList.toggle('out', left === 0);
  $('area').setAttribute('aria-label', `${left} ${left === 1 ? 'moneta' : 'monete'}. Tocca per perderne una, tieni premuto per riaverla`);
  renderLock();
}

/* Tocco e pressione lunga sull'area */
const area = $('area');
let holdT = null, held = false, startX = 0, startY = 0, active = null;
area.addEventListener('touchstart', e => e.preventDefault(), { passive: false });
area.addEventListener('contextmenu', e => e.preventDefault());
area.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (active !== null) return;            // un dito alla volta
  if (S.bloccato) { toast('Schermo bloccato: tieni premuto il lucchetto per sbloccare'); return; }
  active = e.pointerId; held = false; startX = e.clientX; startY = e.clientY;
  if (S.perse > 0) area.classList.add('holding');
  holdT = setTimeout(() => {
    held = true; area.classList.remove('holding');
    if (S.perse > 0) { S.perse--; save(); render(); const s = $('slot' + (TOT - S.perse - 1)); s.classList.remove('back'); void s.offsetWidth; s.classList.add('back'); buzz(30); toast('Moneta ripresa'); }
  }, 600);
});
function release(e, cancelled) {
  if (e.pointerId !== active) return;
  active = null; clearTimeout(holdT); area.classList.remove('holding');
  if (held || cancelled) return;
  if (Math.hypot(e.clientX - startX, e.clientY - startY) > 30) return;   // trascinamento: niente
  if (S.perse >= TOT) { toast('Sei già fuori: tieni premuto per riprendere una moneta'); return; }
  S.perse++; save(); render(); buzz(15);
}
area.addEventListener('pointerup', e => release(e, false));
area.addEventListener('pointercancel', e => release(e, true));
function buzz(ms) { if (navigator.vibrate) try { navigator.vibrate(ms); } catch (e) {} }

/* Blocco: un tocco blocca, per sbloccare si tiene premuto */
const lockBtn = $('lockBtn');
const LOCK_ICON = '<svg viewBox="0 0 20 20" aria-hidden="true"><rect x="4" y="9" width="12" height="9" rx="2" fill="currentColor"/><path d="M7 9V6.5a3 3 0 0 1 6 0V9" fill="none" stroke="currentColor" stroke-width="2"/></svg>';
const OPEN_ICON = '<svg viewBox="0 0 20 20" aria-hidden="true"><rect x="4" y="9" width="12" height="9" rx="2" fill="currentColor"/><path d="M7 9V6.5a3 3 0 0 1 5.8-1" fill="none" stroke="currentColor" stroke-width="2"/></svg>';
let lockT = null;
function renderLock() {
  lockBtn.classList.toggle('on', S.bloccato);
  area.classList.toggle('locked', S.bloccato);
  $('lockLbl').innerHTML = S.bloccato ? `${LOCK_ICON} Tieni premuto` : `${OPEN_ICON} Blocca`;
  lockBtn.setAttribute('aria-label', S.bloccato ? 'Schermo bloccato: tieni premuto per sbloccare' : 'Blocca lo schermo');
  $('hint').style.opacity = S.bloccato ? '.35' : '1';
}
function cancelLock() { clearTimeout(lockT); lockT = null; lockBtn.classList.remove('holding'); }
lockBtn.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (!S.bloccato) { S.bloccato = true; save(); renderLock(); toast('Bloccato'); return; }
  lockBtn.classList.add('holding');
  lockT = setTimeout(() => { cancelLock(); S.bloccato = false; save(); renderLock(); toast('Sbloccato'); }, 700);
});
['pointerup', 'pointerleave', 'pointercancel'].forEach(t => lockBtn.addEventListener(t, cancelLock));
lockBtn.addEventListener('contextmenu', e => e.preventDefault());
lockBtn.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); S.bloccato = !S.bloccato; save(); renderLock(); } });

/* Reset: tutte e tre le monete (serve un secondo tocco entro 3 secondi) */
let resetT = null;
$('resetBtn').onclick = () => {
  const b = $('resetBtn');
  if (!b.classList.contains('armed')) {
    b.classList.add('armed'); b.textContent = 'Sicuro? Tocca ancora';
    clearTimeout(resetT); resetT = setTimeout(() => { b.classList.remove('armed'); b.textContent = 'Reset'; }, 3000);
    return;
  }
  clearTimeout(resetT); b.classList.remove('armed'); b.textContent = 'Reset';
  S.perse = 0; S.bloccato = false; save(); render(); toast('Tre monete');
};

let toastT = null;
function toast(m) { const t = $('toast'); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 1800); }

render();
</script>
<script src="../../comune/app.js"></script>
</body>
</html>
