<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#141C2F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Giochi">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="icon" type="image/png" href="../../icone/icon-192.png">
<link rel="apple-touch-icon" href="../../icone/apple-touch-icon.png">
<title>Conta Monete</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --night:#141C2F; --night-2:#1B2540; --night-3:#0E1424; --line:rgba(232,226,212,.12);
  --text:#ECE7DC; --muted:#97A3BA; --gold:#D8A84A; --red:#E06450;
  --display:'Bricolage Grotesque','Arial Narrow',system-ui,sans-serif;
  --ui:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:var(--night);color:var(--text);font-family:var(--ui);-webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{position:fixed;inset:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:max(8px,env(safe-area-inset-top)) 16px 8px}
.back{flex:1;color:var(--gold);font-weight:700;font-size:15px;text-decoration:none;padding:8px 0}
.title{flex:none;font-family:var(--display);font-weight:800;font-size:21px;margin:0;white-space:nowrap}
.reset{flex:1;text-align:right;padding:8px 0;border:0;background:none;color:var(--muted);font-size:13.5px;font-weight:600;text-decoration:underline;text-underline-offset:3px}
.reset.armed{color:#F0A493}

/* Tutta l'area centrale è il tasto: tocco = perdi una moneta, tieni premuto = la riprendi */
.area{position:relative;flex:1 1 auto;margin:0 10px;border-radius:24px;touch-action:none;cursor:pointer;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
  background:radial-gradient(110% 70% at 50% 40%,#22305A 0%,#18213D 55%,#111829 100%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.05)}
.coins{display:flex;align-items:center;justify-content:center;gap:clamp(10px,4vw,26px);padding:0 12px}
.slot{position:relative;width:clamp(84px,27vw,170px);aspect-ratio:1}
.slot::before{content:'';position:absolute;inset:4%;border-radius:50%;border:2px dashed rgba(236,231,220,.18)}
.coin{position:absolute;inset:0;transition:transform .45s cubic-bezier(.3,1.3,.5,1),opacity .35s ease;filter:drop-shadow(0 10px 12px rgba(0,0,0,.45))}
.coin svg{width:100%;height:100%;display:block}
.slot.lost .coin{opacity:0;transform:translateY(40%) rotate(35deg) scale(.6)}
.slot.back .coin{animation:pop .45s cubic-bezier(.3,1.4,.5,1)}
@keyframes pop{from{transform:scale(.4) rotate(-20deg);opacity:0}to{transform:none;opacity:1}}
.state{font-family:var(--display);font-weight:800;font-size:clamp(24px,7vw,34px);text-align:center;min-height:1.2em}
.state.out{color:var(--red)}
.hint{color:var(--muted);font-weight:600;font-size:14.5px;text-align:center;line-height:1.45;padding:0 18px}
.ring{position:absolute;left:50%;top:50%;width:120px;height:120px;margin:-60px 0 0 -60px;pointer-events:none;opacity:0}
.ring circle{fill:none;stroke:var(--gold);stroke-width:6;stroke-linecap:round;stroke-dasharray:339.3;stroke-dashoffset:339.3;transform:rotate(-90deg);transform-origin:center}
.area.holding .ring{opacity:1}
.area.holding .ring circle{transition:stroke-dashoffset .6s linear;stroke-dashoffset:0}
.area.locked{cursor:default}

.bar{display:flex;justify-content:center;padding:12px 16px calc(14px + env(safe-area-inset-bottom))}
.lock{position:relative;overflow:hidden;display:flex;align-items:center;gap:8px;padding:13px 22px;border-radius:14px;border:1px solid var(--line);background:var(--night-2);font-weight:800;font-size:15.5px}
.lock svg{width:18px;height:18px;position:relative}
.lock .lbl{position:relative}
.lock.on{background:var(--gold);border-color:var(--gold);color:#1A1F2B}
.lock .fill{position:absolute;inset:0;background:rgba(255,255,255,.55);transform:scaleX(0);transform-origin:left}
.lock.holding .fill{transition:transform .7s linear;transform:scaleX(1)}
.toast{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top));transform:translateX(-50%);z-index:30;max-width:92vw;padding:10px 16px;border-radius:12px;background:#ECE7DC;color:#1A1F2B;font-weight:700;font-size:14.5px;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.45);pointer-events:none}
@media (prefers-reduced-motion:reduce){.coin{transition:none}.slot.back .coin{animation:none}.area.holding .ring circle,.lock.holding .fill{transition:none}}
</style>
</head>
<body>
<!-- La moneta: disegno originale dorato da 50 -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <radialGradient id="oro" cx="36%" cy="30%" r="75%">
      <stop offset="0" stop-color="#FFF0A8"/>
      <stop offset=".38" stop-color="#E4BF52"/>
      <stop offset=".78" stop-color="#B38A26"/>
      <stop offset="1" stop-color="#7E5F16"/>
    </radialGradient>
    <linearGradient id="riflesso" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".45"/>
      <stop offset=".45" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <symbol id="moneta" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="48" fill="url(#oro)"/>
      <circle cx="50" cy="50" r="47" fill="none" stroke="#6E5212" stroke-width="2"/>
      <circle cx="50" cy="50" r="44.5" fill="none" stroke="#8A6A1C" stroke-opacity=".75" stroke-width="3.2" stroke-dasharray=".9 1.5"/>
      <circle cx="50" cy="50" r="39.5" fill="none" stroke="#7A5C17" stroke-width="1.6"/>
      <circle cx="50" cy="50" r="38.2" fill="none" stroke="#FFF3BF" stroke-opacity=".6" stroke-width="1"/>
      <g fill="#7A5C17" fill-opacity=".85">
        <circle cx="50" cy="16" r="1.6"/><circle cx="50" cy="84" r="1.6"/><circle cx="16" cy="50" r="1.6"/><circle cx="84" cy="50" r="1.6"/>
        <circle cx="26" cy="26" r="1.2"/><circle cx="74" cy="26" r="1.2"/><circle cx="26" cy="74" r="1.2"/><circle cx="74" cy="74" r="1.2"/>
      </g>
      <text x="50" y="58.5" text-anchor="middle" font-family="'Bricolage Grotesque','Arial Narrow',sans-serif" font-weight="800" font-size="31" fill="#FFF3BF" fill-opacity=".55">50</text>
      <text x="50" y="57.5" text-anchor="middle" font-family="'Bricolage Grotesque','Arial Narrow',sans-serif" font-weight="800" font-size="31" fill="#6B4F10">50</text>
      <text x="50" y="70" text-anchor="middle" font-family="'Figtree',system-ui,sans-serif" font-weight="800" font-size="7.5" letter-spacing="2" fill="#6B4F10">CENT</text>
      <circle cx="50" cy="50" r="48" fill="url(#riflesso)"/>
    </symbol>
  </defs>
</svg>

<div class="app">
  <div class="top">
    <a class="back" href="../../">‹ Giochi</a>
    <h1 class="title">Conta Monete</h1>
    <button class="reset" id="resetBtn">Reset</button>
  </div>

  <div class="area" id="area" role="button" aria-label="Tocca per perdere una moneta, tieni premuto per riaverla">
    <div class="coins" id="coins"></div>
    <div class="state" id="state"></div>
    <div class="hint" id="hint">Tocca per perdere una moneta<br>Tieni premuto per riaverla</div>
    <svg class="ring" viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="54"/></svg>
  </div>

  <div class="bar">
    <button class="lock" id="lockBtn"><span class="fill"></span><span class="lbl" id="lockLbl"></span></button>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
'use strict';
const $ = id => document.getElementById(id);
const KEY = 'gds-contamonete', TOT = 3;
let S = { perse: 0, bloccato: false };
try { Object.assign(S, JSON.parse(localStorage.getItem(KEY)) || {}); } catch (e) {}
S.perse = Math.max(0, Math.min(TOT, S.perse | 0));
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

$('coins').innerHTML = Array.from({ length: TOT }, (_, i) => `<div class="slot" id="slot${i}"><div class="coin"><svg viewBox="0 0 100 100"><use href="#moneta"/></svg></div></div>`).join('');
function render() {
  const left = TOT - S.perse;
  for (let i = 0; i < TOT; i++) $('slot' + i).classList.toggle('lost', i >= left);
  $('state').textContent = left === 0 ? 'Fuori!' : left === 1 ? 'Ultima moneta' : '';
  $('state').classList.toggle('out', left === 0);
  $('area').setAttribute('aria-label', `${left} ${left === 1 ? 'moneta' : 'monete'}. Tocca per perderne una, tieni premuto per riaverla`);
  renderLock();
}

/* Tocco e pressione lunga sull'area */
const area = $('area');
let holdT = null, held = false, startX = 0, startY = 0, active = null;
area.addEventListener('touchstart', e => e.preventDefault(), { passive: false });
area.addEventListener('contextmenu', e => e.preventDefault());
area.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (active !== null) return;            // un dito alla volta
  if (S.bloccato) { toast('Schermo bloccato: tieni premuto il lucchetto per sbloccare'); return; }
  active = e.pointerId; held = false; startX = e.clientX; startY = e.clientY;
  if (S.perse > 0) area.classList.add('holding');
  holdT = setTimeout(() => {
    held = true; area.classList.remove('holding');
    if (S.perse > 0) { S.perse--; save(); render(); const s = $('slot' + (TOT - S.perse - 1)); s.classList.remove('back'); void s.offsetWidth; s.classList.add('back'); buzz(30); toast('Moneta ripresa'); }
  }, 600);
});
function release(e, cancelled) {
  if (e.pointerId !== active) return;
  active = null; clearTimeout(holdT); area.classList.remove('holding');
  if (held || cancelled) return;
  if (Math.hypot(e.clientX - startX, e.clientY - startY) > 30) return;   // trascinamento: niente
  if (S.perse >= TOT) { toast('Sei già fuori: tieni premuto per riprendere una moneta'); return; }
  S.perse++; save(); render(); buzz(15);
}
area.addEventListener('pointerup', e => release(e, false));
area.addEventListener('pointercancel', e => release(e, true));
function buzz(ms) { if (navigator.vibrate) try { navigator.vibrate(ms); } catch (e) {} }

/* Blocco: un tocco blocca, per sbloccare si tiene premuto */
const lockBtn = $('lockBtn');
const LOCK_ICON = '<svg viewBox="0 0 20 20" aria-hidden="true"><rect x="4" y="9" width="12" height="9" rx="2" fill="currentColor"/><path d="M7 9V6.5a3 3 0 0 1 6 0V9" fill="none" stroke="currentColor" stroke-width="2"/></svg>';
const OPEN_ICON = '<svg viewBox="0 0 20 20" aria-hidden="true"><rect x="4" y="9" width="12" height="9" rx="2" fill="currentColor"/><path d="M7 9V6.5a3 3 0 0 1 5.8-1" fill="none" stroke="currentColor" stroke-width="2"/></svg>';
let lockT = null;
function renderLock() {
  lockBtn.classList.toggle('on', S.bloccato);
  area.classList.toggle('locked', S.bloccato);
  $('lockLbl').innerHTML = S.bloccato ? `${LOCK_ICON} Tieni premuto per sbloccare` : `${OPEN_ICON} Blocca lo schermo`;
  $('lockLbl').style.display = 'flex'; $('lockLbl').style.alignItems = 'center'; $('lockLbl').style.gap = '8px';
  $('hint').style.opacity = S.bloccato ? '.35' : '1';
}
function cancelLock() { clearTimeout(lockT); lockT = null; lockBtn.classList.remove('holding'); }
lockBtn.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (!S.bloccato) { S.bloccato = true; save(); renderLock(); toast('Bloccato'); return; }
  lockBtn.classList.add('holding');
  lockT = setTimeout(() => { cancelLock(); S.bloccato = false; save(); renderLock(); toast('Sbloccato'); }, 700);
});
['pointerup', 'pointerleave', 'pointercancel'].forEach(t => lockBtn.addEventListener(t, cancelLock));
lockBtn.addEventListener('contextmenu', e => e.preventDefault());
lockBtn.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); S.bloccato = !S.bloccato; save(); renderLock(); } });

/* Reset: tutte e tre le monete (serve un secondo tocco entro 3 secondi) */
let resetT = null;
$('resetBtn').onclick = () => {
  const b = $('resetBtn');
  if (!b.classList.contains('armed')) {
    b.classList.add('armed'); b.textContent = 'Sicuro? Tocca ancora';
    clearTimeout(resetT); resetT = setTimeout(() => { b.classList.remove('armed'); b.textContent = 'Reset'; }, 3000);
    return;
  }
  clearTimeout(resetT); b.classList.remove('armed'); b.textContent = 'Reset';
  S.perse = 0; S.bloccato = false; save(); render(); toast('Tre monete');
};

let toastT = null;
function toast(m) { const t = $('toast'); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 1800); }

render();
</script>
<script src="../../comune/app.js"></script>
</body>
</html>
